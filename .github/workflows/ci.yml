name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 22.13.0 is the floor in package.json "engines": the first 22.x release in which
        # node:sqlite (the gateway ledger) loads without --experimental-sqlite (on 23.x: 23.4.0).
        # "22" is the latest 22.x.
        node-version: ["22.13.0", "22"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
